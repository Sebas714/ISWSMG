<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasificador: Plataformas y Estado del Arte</title>
<style>
  :root{
    --bg:#0f172a;
    --panel:#1e293b;
    --accent:#38bdf8;
    --accent2:#a78bfa;
    --accent3:#34d399;
    --card:#334155;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --danger:#f87171;
    --ok:#34d399;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e1b4b);
    color:var(--text);
    min-height:100vh;
    padding:24px 16px 60px;
  }
  h1{
    text-align:center;
    font-size:1.5rem;
    margin-bottom:4px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  p.subtitle{
    text-align:center;
    color:var(--muted);
    margin-top:0;
    margin-bottom:20px;
    font-size:0.95rem;
  }
  #scoreboard{
    display:flex;
    justify-content:center;
    gap:24px;
    margin-bottom:20px;
    font-size:0.95rem;
    flex-wrap:wrap;
  }
  #scoreboard span{
    background:var(--panel);
    padding:6px 14px;
    border-radius:20px;
    border:1px solid #334155;
  }
  #pool{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    max-width:900px;
    margin:0 auto 28px;
    min-height:60px;
  }
  .card{
    background:var(--card);
    padding:10px 16px;
    border-radius:10px;
    cursor:grab;
    font-size:0.9rem;
    border:1px solid #475569;
    user-select:none;
    touch-action:none;
    transition:transform .15s, box-shadow .15s;
  }
  .card:active{cursor:grabbing;}
  .card.dragging{
    opacity:0.4;
  }
  .card.wrong{
    animation:shake .4s;
    border-color:var(--danger);
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  #categories{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:1000px;
    margin:0 auto;
  }
  .category{
    flex:1 1 260px;
    min-height:220px;
    background:var(--panel);
    border:2px dashed #475569;
    border-radius:16px;
    padding:16px;
    transition:border-color .2s, background .2s;
  }
  .category h2{
    margin:0 0 10px;
    font-size:1.05rem;
    text-align:center;
  }
  .category.plataforma h2{color:var(--accent);}
  .category.estado h2{color:var(--accent2);}
  .category.aplicacion h2{color:var(--accent3);}
  .category.dragover{
    background:#27304a;
    border-color:var(--accent);
  }
  .dropped{
    display:inline-block;
    background:#0f172a;
    border:1px solid var(--ok);
    color:var(--ok);
    padding:6px 12px;
    border-radius:8px;
    font-size:0.85rem;
    margin:4px;
  }
  #reset{
    display:block;
    margin:30px auto 0;
    background:var(--accent);
    color:#0f172a;
    border:none;
    padding:10px 22px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    font-size:0.9rem;
  }
  #reset:hover{opacity:0.85;}
  #finalMsg{
    text-align:center;
    margin-top:20px;
    font-size:1.1rem;
    color:var(--accent3);
    display:none;
  }
</style>
</head>
<body>

<h1>Clasifica: Plataformas y Estado del Arte</h1>
<p class="subtitle">Arrastra cada tarjeta a la categoría correcta — Software Embebido, Unidad 1</p>

<div id="scoreboard">
  <span>✅ Aciertos: <b id="correctCount">0</b></span>
  <span>❌ Intentos fallidos: <b id="wrongCount">0</b></span>
  <span>🎯 Restantes: <b id="remainingCount">0</b></span>
</div>

<div id="pool"></div>

<div id="categories">
  <div class="category plataforma" data-cat="plataforma">
    <h2>🔧 Plataforma</h2>
    <div class="dropzone" id="drop-plataforma"></div>
  </div>
  <div class="category estado" data-cat="estado">
    <h2>🚀 Estado del arte</h2>
    <div class="dropzone" id="drop-estado"></div>
  </div>
  <div class="category aplicacion" data-cat="aplicacion">
    <h2>🌍 Aplicación</h2>
    <div class="dropzone" id="drop-aplicacion"></div>
  </div>
</div>

<div id="finalMsg">🎉 ¡Completaste el clasificador! Buen repaso de la Unidad 1.</div>
<button id="reset">Reiniciar juego</button>

<script>
const items = [
  {term:"ESP32 / STM32", cat:"plataforma"},
  {term:"Raspberry Pi (SBC)", cat:"plataforma"},
  {term:"FPGA", cat:"plataforma"},
  {term:"FreeRTOS / Zephyr", cat:"plataforma"},
  {term:"DSP (TI C2000)", cat:"plataforma"},
  {term:"TinyML", cat:"estado"},
  {term:"RISC-V", cat:"estado"},
  {term:"Secure boot / OTA", cat:"estado"},
  {term:"NPU (Ethos-U)", cat:"estado"},
  {term:"Aprendizaje federado", cat:"estado"},
  {term:"ADAS automotriz", cat:"aplicacion"},
  {term:"Mantenimiento predictivo", cat:"aplicacion"},
  {term:"Wearables de salud", cat:"aplicacion"},
  {term:"Agricultura de precisión", cat:"aplicacion"},
  {term:"Hogar inteligente", cat:"aplicacion"}
];

let correct = 0, wrong = 0, remaining = items.length;
const pool = document.getElementById('pool');
const correctCountEl = document.getElementById('correctCount');
const wrongCountEl = document.getElementById('wrongCount');
const remainingCountEl = document.getElementById('remainingCount');
const finalMsg = document.getElementById('finalMsg');

function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

function createCard(item){
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.textContent = item.term;
  card.dataset.cat = item.cat;
  card.id = 'card-' + item.term.replace(/[^a-zA-Z0-9]/g,'');

  card.addEventListener('dragstart', e=>{
    e.dataTransfer.setData('text/plain', card.id);
    setTimeout(()=>card.classList.add('dragging'),0);
  });
  card.addEventListener('dragend', ()=>card.classList.remove('dragging'));

  return card;
}

function init(){
  pool.innerHTML = '';
  correct = 0; wrong = 0; remaining = items.length;
  updateScore();
  finalMsg.style.display = 'none';
  document.querySelectorAll('.dropzone').forEach(z=>z.innerHTML='');
  shuffle([...items]).forEach(item=>{
    pool.appendChild(createCard(item));
  });
}

function updateScore(){
  correctCountEl.textContent = correct;
  wrongCountEl.textContent = wrong;
  remainingCountEl.textContent = remaining;
}

document.querySelectorAll('.category').forEach(zone=>{
  zone.addEventListener('dragover', e=>{
    e.preventDefault();
    zone.classList.add('dragover');
  });
  zone.addEventListener('dragleave', ()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop', e=>{
    e.preventDefault();
    zone.classList.remove('dragover');
    const id = e.dataTransfer.getData('text/plain');
    const card = document.getElementById(id);
    if(!card) return;

    if(card.dataset.cat === zone.dataset.cat){
      const badge = document.createElement('div');
      badge.className = 'dropped';
      badge.textContent = card.textContent;
      document.getElementById('drop-'+zone.dataset.cat).appendChild(badge);
      card.remove();
      correct++;
      remaining--;
      updateScore();
      if(remaining === 0){
        finalMsg.style.display = 'block';
      }
    } else {
      card.classList.add('wrong');
      wrong++;
      updateScore();
      setTimeout(()=>card.classList.remove('wrong'), 400);
    }
  });
});

document.getElementById('reset').addEventListener('click', init);

init();
</script>

</body>
</html>
